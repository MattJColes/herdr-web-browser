# herdr-web-browser: a shared Chromium for herdr agents. Agents drive it with the
# `herdr-web-browser` CLI; pages, selections and screenshots flow back to agents
# through `herdr agent prompt` (herdr actions, the status pane, or the
# in-browser extension via Chrome native messaging).

id = "herdr-web-browser"
name = "herdr-web-browser"
version = "1.3.1" # x-release-please-version
description = "A web browser beside your coding agent: previews, page debugging (console, network) and screenshots for agents; ctrl-click localhost links to open them here."
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

# Put `herdr-web-browser` on PATH (~/.local/bin) so agents can call it; replaces its own symlink.
# Also runs install-agents, and install-browser / install-desktop the first time.
[[startup]]
command = ["./target/release/herdr-web-browser", "install-cli"]

[[panes]]
id = "browser"
title = "Browser"
placement = "split"
command = ["./target/release/herdr-web-browser", "pane"]

# Opened by a send when the target agent is ambiguous; the choice becomes sticky.
[[panes]]
id = "picker"
title = "Send to agent"
placement = "popup"
width = "70%"
height = 14
command = ["./target/release/herdr-web-browser", "picker"]

[[actions]]
id = "open"
title = "Browser: open"
description = "Start the browser and open its status pane."
command = ["/bin/sh", "-c", "./target/release/herdr-web-browser start && exec \"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-web-browser --entrypoint browser"]

[[actions]]
id = "toggle-mode"
title = "Browser: toggle headed/headless"
description = "Relaunch the browser in the other mode, keeping tabs."
command = ["./target/release/herdr-web-browser", "mode"]

[[actions]]
id = "send-page"
title = "Browser: send page to agent"
description = "Send the current tab's text to an agent."
command = ["./target/release/herdr-web-browser", "send", "page"]

[[actions]]
id = "send-selection"
title = "Browser: send selection to agent"
description = "Send the selected text in the current tab to an agent."
command = ["./target/release/herdr-web-browser", "send", "selection"]

[[actions]]
id = "send-screenshot"
title = "Browser: send screenshot to agent"
description = "Screenshot the current tab and send its file path to an agent."
command = ["./target/release/herdr-web-browser", "send", "screenshot"]

[[actions]]
id = "stop"
title = "Browser: stop"
description = "Close the browser."
command = ["./target/release/herdr-web-browser", "stop"]

[[actions]]
id = "install-agents"
title = "Browser: set up agents"
description = "Teach Claude Code, Codex, OpenCode and Pi to use this browser for web previews, in every project."
command = ["./target/release/herdr-web-browser", "install-agents"]

[[actions]]
id = "install-browser"
title = "Browser: download Chrome for Testing"
description = "Give the browser its own Chrome so it never takes over your Chrome app."
command = ["./target/release/herdr-web-browser", "install-browser"]

# Target of the link handler below: open the clicked URL beside the pane it was clicked in.
[[actions]]
id = "open-link"
title = "Browser: open clicked link"
description = "Open a ctrl-clicked link in the browser beside this pane."
command = ["/bin/sh", "-c", "exec ./target/release/herdr-web-browser open \"$HERDR_PLUGIN_CLICKED_URL\" --show"]

[[actions]]
id = "install-cli"
title = "Browser: install CLI"
description = "Symlink herdr-web-browser into ~/.local/bin so agents can call it."
command = ["./target/release/herdr-web-browser", "install-cli"]

# Each pane owns a tab: close it with the pane, follow the pane when it moves.
[[events]]
on = "pane.closed"
command = ["./target/release/herdr-web-browser", "on-pane-closed"]

[[events]]
on = "pane.moved"
command = ["./target/release/herdr-web-browser", "on-pane-moved"]

# Ctrl-click a local dev server link (localhost, 127.0.0.1, *.localhost, LAN addresses) in any
# herdr terminal to open it here instead of your everyday browser. Other links open as usual.
[[link_handlers]]
id = "local-dev-server"
title = "Open in herdr-web-browser"
pattern = "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\]|[a-z0-9-]+\\.localhost|192\\.168\\.[0-9]+\\.[0-9]+|10\\.[0-9]+\\.[0-9]+\\.[0-9]+)(:[0-9]+)?([/?#].*)?$"
action = "open-link"
