[package]
name = "herdr-browser"
version = "0.1.0"
edition = "2024"
description = "Chromium for herdr agents: a CLI to drive it, and a bridge to push page data back to an agent."
license = "MIT"
repository = "https://github.com/MattJColes/herdr-browser"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
png = "0.17"
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
