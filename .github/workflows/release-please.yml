name: Release Please

# Keeps a release PR open that bumps the version (Cargo.toml, herdr-plugin.toml, the
# extension) and updates CHANGELOG.md from Conventional Commits. Merging it tags the
# release and publishes it on GitHub.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Thank everyone but the owner and bots whose pull requests are in the release PR. GitHub's
      # generated notes list each pull request since the previous release "by @author". The line
      # goes above the body's last `---`, inside the notes release-please publishes on merge.
      - name: Thank contributors
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          prev=$(gh release view --json tagName --jq .tagName)
          notes=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name=next -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$prev" --jq .body)
          authors=$(grep -oE 'by @[A-Za-z0-9-]+(\[bot\])?' <<<"$notes" | cut -c4- | sort -u | grep -vE "^@($OWNER\$|.*\[bot\]\$)" || true)
          body=$(gh pr view "$PR" --json body --jq .body)
          [ -n "$authors" ] && ! grep -q '^Thanks to @' <<<"$body" || exit 0
          thanks="Thanks to $(paste -sd, - <<<"$authors" | sed 's/,/, /g') for contributing to this release."
          awk -v t="$thanks" '{ l[NR] = $0; if ($0 == "---") last = NR } END { for (i = 1; i <= NR; i++) { if (i == last) print t "\n"; print l[i] } }' <<<"$body" > body.md
          gh pr edit "$PR" --body-file body.md
